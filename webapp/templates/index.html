<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuleRadar</title>

  <!-- Flatpickr date picker -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* ── Design tokens ──────────────────────────────────────────────────────── */
    :root {
      --bg0:      #0d1117;
      --bg1:      #161b22;
      --bg2:      #21262d;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --accent:   #58a6ff;
      --accentHi: #79bbff;
      --green:    #3fb950;
      --orange:   #d29922;
      --red:      #f85149;
      --purple:   #bc8cff;
      --header-h: 58px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg0);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    header {
      height: var(--header-h);
      background: var(--bg1);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      text-decoration: none;
    }

    .logo i { font-size: 20px; }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 380px;
    }

    .search-wrap i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      padding: 7px 10px 7px 32px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      transition: border-color .15s;
    }

    .search-wrap input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .date-range {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-range input {
      width: 118px;
      padding: 7px 10px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .date-range input:focus { outline: none; border-color: var(--accent); }

    .date-sep { color: var(--muted); font-size: 13px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: background .15s, border-color .15s;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accentHi); }

    .btn-ghost {
      background: var(--bg2);
      color: var(--muted);
      border-color: var(--border);
    }

    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

    /* ── Body layout ────────────────────────────────────────────────────────── */
    .layout {
      display: flex;
      height: calc(100vh - var(--header-h));
    }

    /* ── Sidebar (report list) ──────────────────────────────────────────────── */
    .sidebar {
      width: 270px;
      flex-shrink: 0;
      background: var(--bg1);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 10px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .report-list {
      overflow-y: auto;
      flex: 1;
    }

    .report-item {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .12s, border-left-color .12s;
    }

    .report-item:hover { background: var(--bg2); }

    .report-item.active {
      background: var(--bg2);
      border-left-color: var(--accent);
    }

    .report-item .ri-date {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .report-item .ri-time {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .ri-matches {
      font-size: 11px;
      color: var(--green);
      margin-top: 3px;
    }

    /* ── Main viewer ────────────────────────────────────────────────────────── */
    .viewer {
      flex: 1;
      overflow-y: auto;
      background: var(--bg0);
      padding: 36px 52px;
    }

    /* ── Empty / loading states ─────────────────────────────────────────────── */
    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 14px;
      color: var(--muted);
      text-align: center;
    }

    .state i { font-size: 44px; }
    .state p  { font-size: 14px; }

    .spinner {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Rendered Markdown ──────────────────────────────────────────────────── */
    .md h1 {
      font-size: 22px; color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px; margin-bottom: 16px;
    }

    .md h2 {
      font-size: 17px; color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 5px; margin: 28px 0 12px;
    }

    .md h3 { font-size: 14px; color: var(--accent); margin: 18px 0 6px; }

    .md p  { color: var(--muted); line-height: 1.65; margin-bottom: 10px; }

    .md a  { color: var(--accent); text-decoration: none; }
    .md a:hover { text-decoration: underline; }

    .md code {
      background: var(--bg2); padding: 2px 6px;
      border-radius: 4px; font-size: 12px; color: var(--purple);
    }

    .md pre {
      background: var(--bg1); border: 1px solid var(--border);
      border-radius: 6px; padding: 14px 16px;
      overflow-x: auto; margin: 10px 0;
    }

    .md pre code { background: none; padding: 0; color: #d4d4d4; font-size: 12px; }

    .md table { width: 100%; border-collapse: collapse; margin: 12px 0; }

    .md th {
      background: var(--bg2); color: var(--text);
      padding: 8px 12px; text-align: left;
      border: 1px solid var(--border); font-size: 13px;
    }

    .md td {
      padding: 7px 12px;
      border: 1px solid var(--border);
      color: var(--muted); font-size: 13px;
    }

    .md tr:nth-child(even) td { background: var(--bg1); }

    .md blockquote {
      border-left: 4px solid var(--orange);
      padding: 8px 16px; margin: 12px 0;
      background: rgba(210,153,34,.08);
      color: var(--muted);
    }

    .md hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    .md ul, .md ol { padding-left: 20px; color: var(--muted); line-height: 1.7; }

    .md strong { color: var(--text); }

    /* ── Search highlight ───────────────────────────────────────────────────── */
    mark {
      background: rgba(255, 200, 0, .28);
      color: inherit;
      border-radius: 2px;
      padding: 0 2px;
    }

    /* ── Flatpickr dark override ────────────────────────────────────────────── */
    .flatpickr-calendar {
      background: var(--bg1) !important;
      border: 1px solid var(--border) !important;
      box-shadow: 0 4px 16px rgba(0,0,0,.5) !important;
    }

    .flatpickr-day { color: var(--text) !important; border-radius: 4px !important; }
    .flatpickr-day:hover { background: var(--bg2) !important; }
    .flatpickr-day.selected, .flatpickr-day.selected:hover {
      background: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #fff !important;
    }

    .flatpickr-day.flatpickr-disabled { color: var(--muted) !important; }

    .flatpickr-months,
    .flatpickr-month,
    .flatpickr-weekdays,
    span.flatpickr-weekday {
      background: var(--bg2) !important;
      color: var(--muted) !important;
    }

    .flatpickr-current-month,
    .flatpickr-current-month .cur-month,
    .flatpickr-current-month input.cur-year {
      color: var(--text) !important;
    }

    .flatpickr-prev-month svg, .flatpickr-next-month svg { fill: var(--muted) !important; }
    .flatpickr-prev-month:hover svg, .flatpickr-next-month:hover svg { fill: var(--text) !important; }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header>
  <a class="logo" href="/">
    <i class="bi bi-broadcast"></i> RuleRadar
  </a>

  <div class="search-wrap">
    <i class="bi bi-search" style="font-size:13px;"></i>
    <input id="searchInput" type="text"
           placeholder="Search rules, descriptions, SPL…"
           autocomplete="off" spellcheck="false">
  </div>

  <div class="date-range">
    <input id="fromDate" type="text" placeholder="From">
    <span class="date-sep">→</span>
    <input id="toDate"   type="text" placeholder="To">
  </div>

  <button class="btn btn-primary" id="filterBtn">
    <i class="bi bi-funnel-fill"></i> Filter
  </button>

  <button class="btn btn-ghost" id="clearBtn">
    <i class="bi bi-x-lg"></i> Clear
  </button>
</header>

<!-- ── Layout ──────────────────────────────────────────────────────────────── -->
<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header" id="sidebarHeader">Loading…</div>
    <div class="report-list" id="reportList">
      <div class="state" style="height:220px;">
        <div class="spinner"></div>
        <p>Fetching reports…</p>
      </div>
    </div>
  </aside>

  <!-- Viewer -->
  <main class="viewer" id="viewer">
    <div class="state">
      <i class="bi bi-file-earmark-text"></i>
      <p>Select a report from the list</p>
    </div>
  </main>

</div>

<!-- ── Scripts ─────────────────────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
"use strict";

// ── State ─────────────────────────────────────────────────────────────────────
let allReports    = [];   // full unfiltered list from /api/reports
let visibleReports = [];  // currently rendered in sidebar
let activeFile    = null; // filename of the open report
let currentQuery  = "";   // last search term (for highlight)

// ── Date pickers ──────────────────────────────────────────────────────────────
const fpOpts = { dateFormat: "Y-m-d", allowInput: true };
const fpFrom = flatpickr("#fromDate", fpOpts);
const fpTo   = flatpickr("#toDate",   fpOpts);

// ── Initialise ────────────────────────────────────────────────────────────────
(async function init() {
  try {
    const res = await fetch("/api/reports");
    if (!res.ok) throw new Error(res.statusText);
    allReports = await res.json();
    visibleReports = allReports;
    renderSidebar(allReports);
  } catch (e) {
    document.getElementById("reportList").innerHTML = stateHTML(
      "bi-exclamation-circle", "Failed to load reports"
    );
    document.getElementById("sidebarHeader").textContent = "Error";
  }
})();

// ── Sidebar rendering ─────────────────────────────────────────────────────────
function renderSidebar(reports) {
  const n = reports.length;
  document.getElementById("sidebarHeader").textContent =
    `${n} report${n !== 1 ? "s" : ""}`;

  if (n === 0) {
    document.getElementById("reportList").innerHTML = stateHTML(
      "bi-inbox", "No reports match"
    );
    return;
  }

  document.getElementById("reportList").innerHTML = reports.map(r => `
    <div class="report-item${r.name === activeFile ? " active" : ""}"
         data-name="${r.name}" onclick="openReport('${r.name}', this)">
      <div class="ri-date">${r.date}</div>
      ${r.time ? `<div class="ri-time">${r.time}</div>` : ""}
      ${r.matches != null
          ? `<div class="ri-matches"><i class="bi bi-search"></i> ${r.matches} match${r.matches !== 1 ? "es" : ""}</div>`
          : ""}
    </div>
  `).join("");
}

// ── Open a report ─────────────────────────────────────────────────────────────
async function openReport(filename, el) {
  // Highlight active item
  document.querySelectorAll(".report-item").forEach(i => i.classList.remove("active"));
  el.classList.add("active");
  activeFile = filename;

  setViewer(`<div class="state"><div class="spinner"></div><p>Loading…</p></div>`);

  try {
    const res  = await fetch(`/api/report/${encodeURIComponent(filename)}`);
    const data = await res.json();

    if (!data.content) throw new Error("Empty response");

    let html = marked.parse(data.content);

    // Highlight search term if one is active
    if (currentQuery) {
      html = highlightMatches(html, currentQuery);
    }

    setViewer(`<div class="md">${html}</div>`);

    // Scroll to first highlight if present
    requestAnimationFrame(() => {
      const first = document.querySelector("#viewer mark");
      if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
    });

  } catch (e) {
    setViewer(stateHTML("bi-exclamation-circle", "Failed to load report"));
  }
}

// ── Filter / search ───────────────────────────────────────────────────────────
async function applyFilter() {
  const query = document.getElementById("searchInput").value.trim();
  const from  = document.getElementById("fromDate").value;
  const to    = document.getElementById("toDate").value;
  currentQuery = query.toLowerCase();

  // Date-only filter: no API call needed
  if (!query) {
    visibleReports = allReports.filter(r =>
      (!from || r.date >= from) && (!to || r.date <= to)
    );
    renderSidebar(visibleReports);
    return;
  }

  // Text search: call the backend (which caches content server-side)
  document.getElementById("sidebarHeader").textContent = "Searching…";
  document.getElementById("reportList").innerHTML =
    `<div class="state" style="height:220px;"><div class="spinner"></div><p>Searching…</p></div>`;

  let url = `/api/search?q=${encodeURIComponent(query)}`;
  if (from) url += `&from=${encodeURIComponent(from)}`;
  if (to)   url += `&to=${encodeURIComponent(to)}`;

  try {
    const res  = await fetch(url);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error(data.error || "Search failed");
    visibleReports = data;
    renderSidebar(data);

    // If the currently open report is in the results, re-render with highlights
    if (activeFile && data.find(r => r.name === activeFile)) {
      const el = document.querySelector(`.report-item[data-name="${activeFile}"]`);
      if (el) openReport(activeFile, el);
    }
  } catch (e) {
    document.getElementById("sidebarHeader").textContent = "Error";
    document.getElementById("reportList").innerHTML =
      stateHTML("bi-exclamation-circle", "Search failed");
  }
}

function clearFilters() {
  document.getElementById("searchInput").value = "";
  fpFrom.clear();
  fpTo.clear();
  currentQuery = "";
  visibleReports = allReports;
  renderSidebar(allReports);
}

// ── Highlight helper ─────────────────────────────────────────────────────────
// Replaces plain-text occurrences of `term` inside HTML with <mark>, while
// leaving HTML tags themselves untouched.
function highlightMatches(html, term) {
  if (!term) return html;
  const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp(`(${escaped})`, "gi");
  // Replace only within text nodes (between > and <)
  return html.replace(/(?<=>)[^<]+(?=<)/g, seg =>
    seg.replace(re, "<mark>$1</mark>")
  );
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function setViewer(html) {
  document.getElementById("viewer").innerHTML = html;
}

function stateHTML(icon, msg) {
  return `<div class="state" style="height:220px;">
            <i class="bi ${icon}"></i><p>${msg}</p>
          </div>`;
}

// ── Event listeners ───────────────────────────────────────────────────────────
document.getElementById("filterBtn").addEventListener("click", applyFilter);
document.getElementById("clearBtn").addEventListener("click", clearFilters);
document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") applyFilter();
});
</script>
</body>
</html>
