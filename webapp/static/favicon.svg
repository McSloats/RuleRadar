<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RuleRadar">
  <!-- Rounded square background -->
  <rect width="48" height="48" rx="9" fill="#160f2a"/>

  <defs>
    <clipPath id="fav-shield-clip">
      <path d="M24 3 L41 10.5 L41 26 C41 38 32 45 24 47.5 C16 45 7 38 7 26 L7 10.5 Z"/>
    </clipPath>
  </defs>

  <!-- Shield body -->
  <path d="M24 3 L41 10.5 L41 26 C41 38 32 45 24 47.5 C16 45 7 38 7 26 L7 10.5 Z"
