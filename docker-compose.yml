services:

  # ── Web interface + bi-hourly scheduler (single container) ────────────────
  web:
    image: tsloats/ruleradar:latest
    container_name: ruleradar-web
    ports:
      - "5000:5000"
    volumes:
      # Persistent SQLite database, secret key, and cloned repos
      - ruleradar-db:/app/data
    environment:
      - RULERADAR_DB=/app/data/ruleradar.db
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  ruleradar-db:
