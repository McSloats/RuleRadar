services:

  # ── Web interface ──────────────────────────────────────────────────────────────
  web:
    build: .
    container_name: ruleradar-web
    ports:
      - "5000:5000"
    volumes:
      # Persistent SQLite database and secret key shared between web and scheduler
      - ruleradar-db:/app/data
    environment:
      - RULERADAR_DB=/app/data/ruleradar.db
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Bi-hourly scheduler (fires at 00:00, 02:00 … 22:00 UTC) ─────────────────
  scheduler:
    build: .
    container_name: ruleradar-scheduler
    command: ["python3", "core/scheduler.py"]
    volumes:
      - ruleradar-db:/app/data
    environment:
      - RULERADAR_DB=/app/data/ruleradar.db
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

volumes:
  ruleradar-db:
